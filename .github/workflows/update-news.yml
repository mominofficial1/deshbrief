name: Update News & Deploy DeshBrief

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger anytime
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "deshbrief-news-sync"
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Fetch Latest Bangladeshi News
        run: node scripts/fetch-news.js

      - name: Commit & Push Updated News Data
        run: |
          git config --global user.name "DeshBrief News Bot"
          git config --global user.email "bot@deshbrief.internal"
          git add public/data/news.json
          if git diff --staged --quiet; then
            echo "No news changes to commit."
          else
            git commit -m "Auto-update latest news [skip ci]"
            git push origin main
          fi

      - name: Build Static Production Site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
